{% extends "base.html" %}
{% block title %}Post a Job{% endblock %}
{% block content %}
<h3 class="mb-3">Post a New Job</h3>
<div class="row justify-content-center">
    <div class="col-md-8">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Job Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Job Description</label>
                <textarea name="description" class="form-control" rows="5" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Required Skills (comma-separated)</label>
                <input type="text" name="required_skills" class="form-control" placeholder="e.g. python, sql, react">
            </div>
            <button type="submit" class="btn btn-success w-100">Post Job</button>
        </form>
        <a href="{{ url_for('company_dashboard') }}" class="btn btn-link mt-2">Back to Dashboard</a>
    </div>
</div>
{% endblock %}
